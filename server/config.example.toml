host = "0.0.0.0"
port = 26559

# API token for automation, the CLI and the desktop app (leave empty for no auth).
# Browsers never use it: they pair with a one-time code from `nolune pair`.
auth_token = ""

# Path to pre-built client files (leave empty to skip static serving)
static_dir = ""

[llm]
provider = "anthropic" # anthropic or openai; legacy "api" is accepted
# model = "custom-model" # optional active model override

[llm.profiles.anthropic]
heavy = "claude-opus-4-6"
fast = "claude-sonnet-4-6"
cheap = "claude-haiku-4-5-20251001"

[llm.profiles.openai]
heavy = "gpt-5.4"
fast = "gpt-5.4"
cheap = "gpt-5.4-mini"

[llm.tokens]
OPEN_AI = ""         # OpenAI chat and independent semantic text memory
ANTHROPIC = ""       # Required when provider is anthropic — API key (sk-ant-...)
GOOGLE_AI = ""       # Optional — Google AI / Gemini video analysis
ELEVENLABS = ""      # Optional — ElevenLabs (text-to-speech)
OPENROUTER = ""      # Optional — OpenRouter (video analysis)

# Optional: set FAL_KEY env var for AI image generation via fal.ai MCP

# Email is configured per-instance via Settings UI

# Text embeddings are independent of the chat provider and reuse OPEN_AI above.
# Restart after changing this section or the OpenAI key. Missing/disabled/unavailable
# embeddings use BM25; memory writes and generic media attachments keep working.
# Raw media is not embedded until description/transcript support is implemented.
[embedding]
version = 1
enabled = true
provider = "openai"
model = "text-embedding-3-small"
dimensions = 768
base_url = "https://api.openai.com/v1"
# The embedding config API replaces this whole section; omitted fields reset to defaults.
# For local development only, set provider = "openai_compatible" and use an HTTP(S)
# localhost, 127/8, or ::1 endpoint. Compatible endpoints are always unauthenticated:
# OPEN_AI is never sent to them. Remote, private-network, link-local, metadata, userinfo,
# query, and fragment URLs are rejected. No OpenRouter or remote custom provider support
# is implied, and no custom endpoint credential exists in this release.
