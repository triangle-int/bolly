[package]
name = "server"
version = "0.33.0"
edition = "2024"
description = "Bolly — AI companion server"
authors = ["Triangle Interactive LLC"]
license = "MIT"
repository = "https://github.com/triangle-int/bolly"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.10"
log = "0.4"
rmcp = { version = "1.2", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
reqwest = { version = "0.13", features = ["json", "query", "multipart", "stream"] }
dirs = "6.0"
toml = "1.0"
uuid = { version = "1.0", features = ["v4", "v5"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
tempfile = "3"
chrono = "0.4"
schemars = "1"
tokio-util = { version = "0.7.18", features = ["rt", "compat", "io"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
futures = "0.3"
base64 = "0.22"
regex = "1"
serde_yml = "0.0.12"
portable-pty = "0.9"
zip = "8"
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
rust-embed = { version = "8", features = ["mime-guess"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
imap = "2"
native-tls = "0.2"
anyhow = "1.0.102"
bm25 = "2.3.2"
clap = { version = "4", features = ["derive"] }
